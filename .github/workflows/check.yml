name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts
      - run: git diff --exit-code -- crates/contracts/schema packages/contracts/src
      - run: npm run content:build
      - run: python scripts/prepare-runtime.py
      - run: python scripts/prepare-notices.py
      - run: npm run check
      - run: cargo build -p fluenta-desktop
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: desktop-test-report
          path: .cache/playwright-report/
          include-hidden-files: true
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
