name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    permissions:
      contents: write # GitHub requires write access to see draft releases.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - run: python3 scripts/package-release.py --check
      - name: Require a draft release for the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-${{ matrix.platform }}
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libfuse2t64 xvfb
      - run: npm ci
      - run: npm run content:build
      - run: python scripts/prepare-runtime.py
      - run: python scripts/prepare-notices.py
      - run: npm run check
      - name: Verify native speech without a microphone
        run: cargo run -p fluenta-speech --example verify_speech
        env:
          FLUENTA_NATIVE_DIAGNOSTICS: "1"
      - name: Windows desktop tests
        if: runner.os == 'Windows'
        env:
          FLUENTA_TEST_EXE: ${{ github.workspace }}/target/debug/fluenta.exe
        run: |
          $runtime = Get-ItemProperty -Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -Name pv -ErrorAction SilentlyContinue
          if (-not ($runtime | Where-Object { $_.pv -and [version]$_.pv -gt [version]'0.0.0.0' })) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 setup failed: $($setup.ExitCode)" }
          }
          npm run tauri -w @fluenta/desktop -- build --debug --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:e2e
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        run: python scripts/package-release.py
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Smoke-test Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          FLUENTA_NATIVE_DIAGNOSTICS: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1" # Xvfb has no hardware compositor.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -x
          sudo apt-get install -y ./artifacts/release/*.deb
          resources=$(dirname "$(dpkg -L fluenta | grep '/resource-manifest.json$')")
          cargo run -p fluenta-speech --example verify_speech -- "$resources"
          mkdir -p .cache/linux-smoke
          set +e
          FLUENTA_DATA_DIR="$PWD/.cache/linux-smoke/deb" dbus-run-session -- xvfb-run -a timeout 20 fluenta >.cache/linux-smoke/deb.log 2>&1
          result=$?
          set -e
          test "$result" = 124
          test -s .cache/linux-smoke/deb/learner/student.sqlite
          chmod +x artifacts/release/*.AppImage
          set +e
          FLUENTA_DATA_DIR="$PWD/.cache/linux-smoke/appimage" dbus-run-session -- xvfb-run -a timeout 20 artifacts/release/*.AppImage --appimage-extract-and-run >.cache/linux-smoke/appimage.log 2>&1
          result=$?
          set -e
          test "$result" = 124
          test -s .cache/linux-smoke/appimage/learner/student.sqlite
      - name: Preserve macOS native resources and permissions
        if: runner.os == 'macOS'
        run: tar -czf ${{ matrix.platform }}.tar.gz -C apps/desktop/src-tauri/resources .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'macOS'
        with:
          name: resources-${{ matrix.platform }}
          path: ${{ matrix.platform }}.tar.gz
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os != 'macOS'
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: logs-${{ matrix.platform }}
          path: |
            .cache/playwright-report/
            .cache/*/native.log
            .cache/linux-smoke/*.log
          include-hidden-files: true

  macos:
    needs: [prepare, native]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: universal-macos
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          pattern: resources-macos-*
          merge-multiple: true
      - name: Combine architecture-specific speech engines
        run: |
          mkdir -p apps/desktop/src-tauri/resources .cache/mac-x64
          tar -xzf macos-arm64.tar.gz -C apps/desktop/src-tauri/resources
          tar -xzf macos-x64.tar.gz -C .cache/mac-x64
          mv apps/desktop/src-tauri/resources/runtimes apps/desktop/src-tauri/resources/aarch64
          mkdir apps/desktop/src-tauri/resources/runtimes
          mv apps/desktop/src-tauri/resources/aarch64 apps/desktop/src-tauri/resources/runtimes/aarch64
          mv .cache/mac-x64/runtimes apps/desktop/src-tauri/resources/runtimes/x86_64
          python3 -c "import runpy; runpy.run_path('scripts/prepare-runtime.py')['inventory']()"
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build universal application, DMG and updater archive
        run: python3 scripts/package-release.py
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify universal application
        env:
          FLUENTA_NATIVE_DIAGNOSTICS: "1"
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/Fluenta.app
          lipo "$app/Contents/MacOS/fluenta" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          cargo run --release --target aarch64-apple-darwin -p fluenta-speech --example verify_speech -- "$app/Contents/Resources"
          FLUENTA_DATA_DIR="$PWD/.cache/mac-smoke" "$app/Contents/MacOS/fluenta" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          test -s .cache/mac-smoke/learner/student.sqlite
          kill "$pid"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: artifacts/release/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  upload:
    needs: [prepare, native, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Validate filenames, merge updater feed and hash all downloads
        run: python3 scripts/package-release.py --assemble artifacts/release
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 9
