[package]
name = "fluenta-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "fluenta"

[features]
studio = []

[[bin]]
name = "fluenta"
path = "src/main.rs"

[lib]
name = "fluenta_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fluenta-contracts.workspace = true
fluenta-content.workspace = true
fluenta-learning.workspace = true
fluenta-storage.workspace = true
fluenta-speech.workspace = true
fluenta-tutor.workspace = true
fluenta-runtime.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
